<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — DatRex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Quick styles to match the SwiftTrust look */
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-soft); }
    .auth-card { width: 100%; max-width: 400px; background: #fff; padding: 32px; border-radius: 20px; box-shadow: var(--shadow-lg); }
    .auth-brand { text-align: center; margin-bottom: 24px; }
    .auth-logo { width: 56px; height: 56px; background: var(--green); color: #fff; display: grid; place-items: center; border-radius: 16px; font-size: 24px; margin: 0 auto 16px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
    .input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 15px; }
    .input:focus { outline: none; border-color: var(--green); }
    .form-alert { display: none; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; text-align: center; }
    .form-alert.show { display: block; background: var(--danger-light); color: var(--danger); border: 1px solid #fecaca; }
    .form-alert.info { background: var(--info-light); color: var(--info); border-color: #bfdbfe; }
    .auth-foot { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-foot a { color: var(--green); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fas fa-shield-halved"></i></div>
      <h1 style="font-size: 24px; font-weight: 800; color: var(--text); margin: 0;">Sign in</h1>
      <p style="font-size: 14px; color: var(--text-muted); margin-top: 6px;">Welcome back to DatRex.</p>
    </div>

    <form id="loginForm">
      <div class="form-alert" id="loginAlert"></div>

      <div class="field">
        <label>Email address</label>
        <input class="input" type="email" id="email" placeholder="@example.com" required />
      </div>

      <div class="field">
        <label>Password</label>
        <input class="input" type="password" id="password" placeholder="password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn" style="margin-top: 8px;">
        <i class="fas fa-lock-open"></i> Sign in
      </button>

      <div class="auth-foot">
        Don't have an account? <a href="signup.html">Open one</a>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertEl = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, type) {
      alertEl.textContent = msg;
      alertEl.className = 'form-alert show ' + (type || 'error');
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'form-alert';

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Signing in…';

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const uid = cred.user.uid;

        // Check if admin
        if (email === STB_ADMIN_EMAIL.toLowerCase()) {
          window.location.href = 'admin.html';
          return;
        }

        // Fetch user profile from DatRex database
        const snap = await db.collection(STB_C.users).doc(uid).get();

        if (!snap.exists) {
          await auth.signOut();
          showAlert('No DatRex account is linked to this email.');
          return;
        }

        const data = snap.data();
        const status = data.status || 'pending';

        if (status === 'blocked') {
          await auth.signOut();
          showAlert('This account has been suspended. Contact support.');
          return;
        }

        if (status === 'pending') {
          window.location.href = 'pending.html';
          return;
        }

        window.location.href = 'dashboard.html';

      } catch (err) {
        console.error(err);
        let msg = 'Sign in failed. Please try again.';
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          msg = 'Incorrect email or password.';
        } else if (err.code === 'auth/too-many-requests') {
          msg = 'Too many attempts. Please try again in a moment.';
        }
        showAlert(msg);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-lock-open"></i> Sign in';
      }
    });
  </script>
</body>
</html>
